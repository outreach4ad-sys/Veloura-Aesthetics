; Veloura Tec — PHP limits for image/video uploads on Hostinger.
; Hostinger's PHP (LSAPI/FPM) reads this file in the document root, so you
; can raise upload limits here without opening the hPanel PHP configuration.
; If your host ignores .user.ini, set the same values in hPanel → PHP
; Configuration → PHP options.

upload_max_filesize = 16M
post_max_size = 20M
max_file_uploads = 20
max_execution_time = 120
memory_limit = 256M
